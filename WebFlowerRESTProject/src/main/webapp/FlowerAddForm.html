<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Add Flower</title>

<style>
body{
    font-family:Arial;
    background:#fdf6f9;
}

.container{
    width:400px;
    margin:60px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
    color:#d63384;
    text-align:center;
}

label{
    display:block;
    margin-top:10px;
    font-weight:bold;
}

input{
    width:100%;
    padding:8px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    margin-top:15px;
    width:100%;
    padding:10px;
    background:#d63384;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#b52a6f;
}
</style>
</head>

<body>

<div class="container">

<h2>Add Flower</h2>

<form method="post" action="./rest/WebFlower/addFlower">

<label>Flower ID</label>
<input type="text" name="flowerId" required>

<label>Name</label>
<input type="text" name="name" required>

<label>Color</label>
<input type="text" name="color" required>

<label>Price</label>
<input type="number" step="0.01" name="price" required>

<label>Stock</label>
<input type="number" name="stock" required>

<button type="submit">Save</button>

</form>

</div>

</body>
</html>
