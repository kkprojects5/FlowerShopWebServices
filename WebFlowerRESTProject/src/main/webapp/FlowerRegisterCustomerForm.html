<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Flower Shop - Customer Registration</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#fdf6f9;
}

.container{
    width:550px;
    margin:50px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#d63384;
}

.nav{
    text-align:center;
    margin-bottom:20px;
}

.nav a{
    text-decoration:none;
    color:#d63384;
    font-weight:bold;
    margin:0 10px;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    border-radius:8px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

.buttons{
    text-align:center;
    margin-top:25px;
}

input[type=submit]{
    background:#d63384;
    color:white;
    border:none;
}

input[type=reset]{
    background:#6c757d;
    color:white;
    border:none;
}
</style>

</head>
<body>


<h1>Customer Registration</h1>

<form method="post" action="./rest/WebFlower/registerCustomer">

<label>Customer Name</label>
<input type="text" name="name" required>

<label>Email</label>
<input type="text" name="email" required>

<label>Phone</label>
<input type="text" name="phone" required>

<label>Password</label>
<input type="password" name="password" required>

<input type="submit" value="Register">
</form>

</body>
</html>
