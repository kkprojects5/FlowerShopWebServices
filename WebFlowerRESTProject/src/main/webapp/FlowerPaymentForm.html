<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Payment</title>

<style>
body{
    font-family: Arial;
    background:#fdf6f9;
}

.container{
    width:420px;
    margin:60px auto;
    background:white;
    padding:25px;
    border-radius:12px;
}

h2{
    text-align:center;
    color:#d63384;
}

label{
    display:block;
    margin-top:10px;
    font-weight:bold;
}

input, select{
    width:100%;
    padding:10px;
    margin-top:5px;
    border-radius:6px;
    border:1px solid #ccc;
}

button{
    width:100%;
    margin-top:15px;
    padding:10px;
    background:#d63384;
    color:white;
    border:none;
    border-radius:6px;
}
</style>

</head>

<body>

<div class="container">

<h2>Make Payment</h2>

<form method="post" action="./rest/WebFlower/makePayment">

<label>Order ID</label>
<input name="orderId" placeholder="O101" required>

<label>Payment Method</label>
<select name="paymentMethod">
    <option>Cash</option>
    <option>Credit Card</option>
    <option>Debit Card</option>
</select>

<button type="submit">Pay Now</button>

</form>

</div>

</body>
</html>
